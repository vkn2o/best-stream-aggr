[pytest]
testpaths = tests
# Live browser checks are excluded from the default run: they launch real
# Chromium against third-party sites, so they are slow and depend on those
# sites being up. Run them deliberately with `pytest -m live_browser`.
addopts = -m "not live_browser"
markers =
    allow_network: test may make real network calls (opt out of the offline guard)
    live_browser: test drives a real headless browser against live sites (excluded by default)
